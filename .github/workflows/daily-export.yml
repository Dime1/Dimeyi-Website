name: Daily RSVP export to Google Sheets

# NOTE: this file must live at .github/workflows/daily-export.yml in your repo
# for GitHub to pick it up as a scheduled workflow.

on:
  schedule:
    - cron: "0 6 * * *"   # 6:00 AM UTC daily — adjust to your preferred time
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab too

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run export script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python export_rsvp_to_sheets.py
