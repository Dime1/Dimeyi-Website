name: Daily RSVP export to Google Sheets

# NOTE: this file must live at .github/workflows/daily-export.yml in your repo
# for GitHub to pick it up as a scheduled workflow.

on:
  schedule:
    # 6:00 PM Berlin time, year-round. GitHub Actions cron runs on UTC only
    # and has no concept of daylight saving, so the month field is used to
    # pick the right UTC offset per season (approximate: actual EU DST
    # changeover is the last Sunday of March / October, so there's up to a
    # ~1-week drift right at the boundary each way).
    - cron: "0 16 * 4-10 *"      # Apr–Oct: 16:00 UTC = 18:00 CEST (summer, UTC+2)
    - cron: "0 17 * 1-3,11-12 *" # Nov–Mar: 17:00 UTC = 18:00 CET  (winter, UTC+1)
  workflow_dispatch: {}          # lets you trigger it manually from the Actions tab too

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run export script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python export_rsvp_to_sheets.py
